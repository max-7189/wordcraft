# Fork-only (PosseChat spike #1041): build the web app with the embedding bridge on Linux and
# publish the static site as a prerelease asset. Not meant for upstream.
name: Spike web build

on:
  push:
    branches: [spike-1041, embed-compact-ribbon]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spike-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: spike-web
      - name: Install trunk 0.21.14
        run: |
          url="https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/trunk.tar.gz" "$url"
          echo "f2b4680cd239693a646a2795e4633c625328d7b2a044fbe749fa3a2fe9e7036b  $RUNNER_TEMP/trunk.tar.gz" | sha256sum -c -
          tar -xz -C "$HOME/.cargo/bin" -f "$RUNNER_TEMP/trunk.tar.gz" trunk
          trunk --version
      # Upstream crates carry wasm-only warnings (e.g. unused_mut in crates/fonts at v0.6.1), so the
      # gate is: no warning in the files this fork changes (web.rs, web/host.rs).
      - name: Clippy (wasm, this app)
        run: |
          cargo clippy -p wordcraft-web --target wasm32-unknown-unknown --locked --message-format=short 2>&1 | tee clippy.txt
          if grep -E '^apps/wordcraft-web/src/(web\.rs|web/host\.rs).*(warning|error)' clippy.txt; then exit 1; fi
      - name: Embed-mode UI tests (compact ribbon)
        run: |
          set -o pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgtk-3-dev libfontconfig1-dev libfreetype-dev libvulkan1 mesa-vulkan-drivers
          cargo test -p wordcraft-ui-egui --lib --locked -- ribbon::tests::compact ribbon::tests::ribbon_layout 2>&1 | tee ui-tests.txt
      - name: Build
        working-directory: apps/wordcraft-web
        run: trunk build --release
      - name: Package
        run: |
          short=$(git rev-parse --short=10 HEAD)
          name="wordcraft-web-${GITHUB_REF_NAME}-$short"
          mkdir -p "out/$name"
          cp -R dist/web/. "out/$name/"
          cp packaging/web/_headers packaging/web/.htaccess "out/$name/"
          (cd out && zip -qr9 "$name.zip" "$name" && sha256sum "$name.zip" > "$name.zip.sha256")
          ls -l "out/$name" out/*.zip
          for f in out/$name/*.wasm; do echo "$f raw=$(stat -c%s "$f") gzip9=$(gzip -9c "$f" | wc -c)"; done
          echo "NAME=$name" >> "$GITHUB_ENV"
          echo "SHORT=$short" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: out/${{ env.NAME }}.zip*
      - name: Prerelease asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}-${SHORT}" out/$NAME.zip out/$NAME.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
            --title "${GITHUB_REF_NAME} web ${SHORT}" --notes "Web build of $GITHUB_SHA (embedding bridge, PosseChat spike #1041)."
